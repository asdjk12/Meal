<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal · 食材录入测试</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f8; color: #1f2329;
  }
  header { padding: 14px 20px; border-bottom: 1px solid #e5e6eb; background: #fff; font-weight: 600; }
  header span { font-weight: 400; color: #86909c; font-size: 13px; margin-left: 8px; }

  #chat { flex: 1; overflow-y: auto; padding: 24px 0; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  .msg { display: flex; margin-bottom: 20px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: #4d6bfe; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #fff; border: 1px solid #e5e6eb; border-bottom-left-radius: 4px; white-space: normal; }
  .bubble img.det { max-width: 100%; max-height: 480px; margin: 8px 0 0; }
  .bubble img { display: block; max-width: 260px; max-height: 260px; border-radius: 8px; margin-bottom: 6px; }
  .bubble.error { border-color: #f53f3f; color: #f53f3f; }
  .empty { text-align: center; color: #86909c; margin-top: 18vh; line-height: 2; }

  table { border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 12px; text-align: left; border-bottom: 1px solid #f2f3f5; }
  th { color: #86909c; font-weight: 500; }
  tr.low td { color: #ff7d00; }
  .meta { font-size: 12px; color: #86909c; margin-top: 8px; }
  details { margin-top: 6px; font-size: 12px; }
  details pre { background: #f7f8fa; padding: 8px; border-radius: 6px; overflow-x: auto; }

  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: #c9cdd4; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  footer { padding: 12px 0 20px; }
  .composer { background: #fff; border: 1px solid #dcdfe6; border-radius: 16px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .composer.drag { border-color: #4d6bfe; background: #f2f5ff; }
  #preview { display: none; position: relative; width: 72px; margin-bottom: 8px; }
  #preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  #preview button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #1f2329; color: #fff; cursor: pointer; font-size: 12px; line-height: 20px; padding: 0; }
  textarea { width: 100%; border: none; outline: none; resize: none; font: inherit; font-size: 15px; min-height: 24px; max-height: 200px; background: transparent; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .bar .tip { font-size: 12px; color: #86909c; }
  .btn { border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
  #attach { background: #f2f3f5; }
  #send { background: #4d6bfe; color: #fff; }
  #send:disabled { background: #c9cdd4; cursor: not-allowed; }
</style>
</head>
<body>
<header>Meal 食材录入<span>测试页 · 文字 → DeepSeek · 图片 → 本地 YOLO 果蔬检测</span></header>

<div id="chat"><div class="wrap" id="list">
  <div class="empty" id="empty">
    输入家里有哪些食材，例如：<b>两个番茄、半斤五花肉、几个鸡蛋</b><br>
    或者点 📎 / 粘贴 / 拖入一张果蔬照片（图片识别只认识 63 类果蔬，鸡蛋、肉类等请用文字）
  </div>
</div></div>

<footer><div class="wrap">
  <div class="composer" id="composer">
    <div id="preview"><img id="previewImg" alt=""><button id="removeImg" title="移除">✕</button></div>
    <textarea id="input" rows="1" placeholder="文字描述食材，或附一张果蔬照片（两者可同时发送）"></textarea>
    <div class="bar">
      <div>
        <button class="btn" id="attach" title="上传图片">📎</button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <span class="tip">Enter 发送 · Shift+Enter 换行</span>
      <button class="btn" id="send" title="发送" disabled>↑</button>
    </div>
  </div>
</div></footer>

<script>
const $ = id => document.getElementById(id);
const input = $("input"), send = $("send"), fileInput = $("file"), list = $("list");
let image = null;   // 当前附带的图片 File
let busy = false;

function refresh() {
  send.disabled = busy || (!input.value.trim() && !image);
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
}

function setImage(f) {
  if (f && !f.type.startsWith("image/")) return;
  image = f || null;
  $("preview").style.display = image ? "block" : "none";
  if (image) $("previewImg").src = URL.createObjectURL(image);
  fileInput.value = "";
  refresh();
}

function addMsg(role, build) {
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  build(b);
  row.appendChild(b);
  list.appendChild(row);
  $("chat").scrollTop = $("chat").scrollHeight;
  return b;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => n == null ? "—" : (Number.isInteger(n) ? n : +n.toFixed(2));

function renderResult(b, data, label) {
  const items = data.ingredients;
  if (!items.length) {
    b.innerHTML = "没有识别到食材。";
  } else {
    b.innerHTML = `识别到 <b>${items.length}</b> 种食材：
      <table><tr><th>名称</th><th>数量</th><th>单位</th><th>分类</th><th>置信度</th></tr>
      ${items.map(i => `<tr class="${i.confidence < 0.6 ? "low" : ""}">
        <td>${esc(i.name)}</td><td>${num(i.quantity)}</td><td>${esc(i.unit ?? "—")}</td>
        <td>${esc(i.category)}</td><td>${i.confidence.toFixed(2)}</td></tr>`).join("")}
      </table>`;
  }
  if (data.preview) b.innerHTML += `<img class="det" src="${data.preview}" alt="检测框">`;
  const { preview, ...raw } = data;   // 预览图是 base64，太长，不放进 JSON 展示
  b.innerHTML += `<div class="meta">${label} · 耗时 ${(data.elapsed_ms / 1000).toFixed(1)}s · 橙色 = 置信度低于 0.6</div>
    <details><summary>原始 JSON</summary><pre>${esc(JSON.stringify(raw, null, 2))}</pre></details>`;
}

async function submit() {
  const text = input.value.trim(), img = image;
  if (busy || (!text && !img)) return;

  addMsg("user", b => {
    if (img) { const el = new Image(); el.src = URL.createObjectURL(img); b.appendChild(el); }
    if (text) b.appendChild(document.createTextNode(text));
  });
  input.value = ""; setImage(null);
  busy = true; refresh();

  // 图片和文字分别走两个接口，各回一条消息
  const jobs = [];
  if (img) {
    const fd = new FormData();
    fd.append("file", img);
    jobs.push(["图片 · YOLO", fetch("/api/ingredients/image", { method: "POST", body: fd })]);
  }
  if (text) {
    jobs.push(["文字 · DeepSeek", fetch("/api/ingredients/text", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    })]);
  }
  await Promise.all(jobs.map(async ([label, req]) => {
    const reply = addMsg("bot", b => b.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>');
    try {
      const res = await req;
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      renderResult(reply, data, label);
    } catch (e) {
      reply.classList.add("error");
      reply.textContent = `出错了（${label}）：` + e.message;
    }
  }));
  busy = false; refresh(); input.focus();
  $("chat").scrollTop = $("chat").scrollHeight;
}

input.addEventListener("input", refresh);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
send.onclick = submit;
$("attach").onclick = () => fileInput.click();
fileInput.onchange = () => setImage(fileInput.files[0]);
$("removeImg").onclick = () => setImage(null);

// 粘贴图片
input.addEventListener("paste", e => {
  const f = [...e.clipboardData.files].find(f => f.type.startsWith("image/"));
  if (f) { e.preventDefault(); setImage(f); }
});
// 拖入图片
const composer = $("composer");
document.addEventListener("dragover", e => { e.preventDefault(); composer.classList.add("drag"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) composer.classList.remove("drag"); });
document.addEventListener("drop", e => {
  e.preventDefault(); composer.classList.remove("drag");
  setImage([...e.dataTransfer.files].find(f => f.type.startsWith("image/")));
});
input.focus();
</script>
</body>
</html>
